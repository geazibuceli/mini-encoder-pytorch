[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-encoder-pytorch"
version = "0.1.0"
description = "Educational sentiment classification with PyTorch"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy", "scikit-learn", "PyYAML"]

[project.optional-dependencies]
data = ["datasets"]
visualization = ["matplotlib"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
