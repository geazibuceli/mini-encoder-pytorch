[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-encoder-pytorch"
version = "0.1.0"
description = "Educational sentiment classification with PyTorch"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy", "scikit-learn", "PyYAML"]

[project.optional-dependencies]
data = ["datasets"]
visualization = ["matplotlib"]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
