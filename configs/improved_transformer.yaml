seed: 42
model:
  type: transformer
  embedding_dimension: 64
  heads: 4
  layers: 1
  feedforward_dimension: 128
  dropout: 0.2
  pooling: mean
  attention_backend: sdpa
training:
  epochs: 8
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  device: auto
  threads: 4
